name: Build and deploy

# Rebuilds the site on every push, and once a night so the "nightly loop" has
# a fresh build to attach its report to.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build site
        # To move to a custom domain later, set repository variables:
        #   gh variable set SITE_URL  --body "https://printmath.io"
        #   gh variable set BASE_PATH --body ""
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://bosswnx.github.io/printmath' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/printmath' }}
        run: node src/build.js
      - name: Verify (links, titles, duplicates)
        run: node src/check.js
      - name: SEO report
        run: node scripts/loop.js || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
